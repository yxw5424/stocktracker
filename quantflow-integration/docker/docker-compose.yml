# 一条命令跑起来：docker compose up --build
# 只依赖 Mongo（LOCAL 模式，RabbitMQ/Redis 不需要）。
# 仅本机可访问（端口映射到 127.0.0.1）。首次构建会拉 torch+tensorflow，较大较慢。
name: quantflow-ai

services:
  # 单节点 MongoDB 副本集（QuantFlow 强制要求副本集）
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 自动初始化副本集 rs0（幂等）
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status().ok }
          catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}) }'

  # QuantFlow 本体 + AI 节点 + Claude 补丁
  quantflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      RUN_MODE: "LOCAL"          # 关键：LOCAL 模式只用 Mongo，不需要 RabbitMQ
      MONGO_URI: "mongo:27017"
      MONGO_USER: ""             # 置空 => 不启用鉴权（本地）
      MONGO_PASSWORD: ""
      MONGO_TYPE: "replica_set"
      MONGO_REPLICA_SET: "rs0"
      DATABASE_NAME: "panda"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"   # 从同目录 .env 读；留空则内置聊天回退 DeepSeek
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"     # 可选：AI 顾问节点的 DeepSeek 后端(国内好开通)
      HT_APIKEY: "${HT_APIKEY:-}"                   # 只读看板查华泰挂单/持仓用(不下单;quantflow 无 HTSC_LIVE)
      MATCHING_TYPE: "${MATCHING_TYPE:-1}"          # 回测撮合:1=当日开盘(默认) 0=当日收盘(尾盘执行对照)
      BACKTEST_SLIPPAGE: "${BACKTEST_SLIPPAGE:-0}"  # 回测每边滑点比例(0.001=0.1%);平台原硬编码0,偏乐观
      # 代理（可选）：国内直连 api.anthropic.com 不通时，把宿主机代理透传给容器。
      # Docker Desktop(Win/Mac) 用 host.docker.internal 指宿主机，如 http://host.docker.internal:7890
      HTTP_PROXY: "${DOCKER_PROXY:-}"
      HTTPS_PROXY: "${DOCKER_PROXY:-}"
      # 容器内网/国内可直连的不走代理(东财/新浪是看板资讯页数据源,走代理会 SSL EOF)
      NO_PROXY: "mongo,localhost,127.0.0.1,api.deepseek.com,.eastmoney.com,.sina.com.cn,.sinajs.cn"
    ports:
      - "127.0.0.1:8000:8000"    # 只绑本机，外部访问不到
    volumes:
      - "./reports:/reports"     # 回测汇总表等 HTML 报告落到宿主机 docker/reports/
    restart: unless-stopped

  # 数据导入器：把 watchlist.txt 里的自选股行情用 akshare 灌进 Mongo。
  # 不随 `up` 启动;手动一次性跑： docker compose run --rm loader
  loader:
    profiles: ["load"]
    build:
      context: ..
      dockerfile: docker/loader/Dockerfile
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      MONGO_URI: "mongo:27017"
      MONGO_USER: ""             # 与 quantflow 一致：本地无鉴权
      MONGO_PASSWORD: ""
      MONGO_AUTH_DB: "admin"
      MONGO_DB: "panda"
      START_DATE: "${START_DATE:-20240101}"
      END_DATE: "${END_DATE:-}"          # 留空=今天
      LOAD_MINUTE: "${LOAD_MINUTE:-0}"   # 设 1 额外拉分时线(慢、量大)
      WATCHLIST: "${WATCHLIST:-}"        # 也可用环境变量覆盖 watchlist.txt
      WATCHLIST_FILE: "${WATCHLIST_FILE:-/data/watchlist.txt}"  # 换 ETF 名单:/data/watchlist-etf.txt
      ASSET_TYPE: "${ASSET_TYPE:-stock}"  # etf=用 ETF 数据源(参赛用;LOAD_ALL=1 时忽略)
      ETF20: "${ETF20:-}"                 # 20%涨跌幅的非588 ETF追加名单(159915等已内置),逗号分隔
      LOAD_ALL: "${LOAD_ALL:-0}"          # 1=四份名单全量一次灌完(默认2021起),以后更新只跑这一条
      # loader 只访问国内行情源(东财/新浪/上交所)和容器内 mongo，全部直连：
      # 显式置空，防止 Docker Desktop 把宿主机代理注入进来导致 SSL EOF。
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "*"
    volumes:
      - "./watchlist.txt:/data/watchlist.txt:ro"
      - "./watchlist-etf.txt:/data/watchlist-etf.txt:ro"
      - "./watchlist-etf-broad.txt:/data/watchlist-etf-broad.txt:ro"
      - "./watchlist-kechuang-semi.txt:/data/watchlist-kechuang-semi.txt:ro"
      - "./watchlist-smartbeta.txt:/data/watchlist-smartbeta.txt:ro"

  # AI 信号复核官:收盘后跑一次 → 信号+复核+纸面执行+复盘报告(reports/ 目录)。
  # 手动:docker compose run --rm reviewer   (建议先跑一次 loader 更新行情)
  reviewer:
    profiles: ["review"]
    build:
      context: ..
      dockerfile: docker/review/Dockerfile
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      MONGO_URI: "mongo:27017"
      MONGO_USER: ""
      MONGO_PASSWORD: ""
      MONGO_AUTH_DB: "admin"
      MONGO_DB: "panda"
      PROVIDER: "${PROVIDER:-deepseek}"
      FULL_AUTH: "${FULL_AUTH:-1}"        # 1=全权模式(agent 可主动买卖,纸面)
      EVAL_DAYS: "${EVAL_DAYS:-5}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # 华泰模拟盘(ETF 巅峰赛):配了 HT_APIKEY 就把执行的决定发到华泰;
      # HTSC_LIVE=1 才真下单(=正式参赛,不可逆,见 README),默认 0 干跑。
      HT_APIKEY: "${HT_APIKEY:-}"
      HTSC_LIVE: "${HTSC_LIVE:-0}"
      HTSC_ORDER_LOTS: "${HTSC_ORDER_LOTS:-100}"     # 兜底手数(定量失败时)
      HTSC_BUDGET_PCT: "${HTSC_BUDGET_PCT:-0.31}"    # 每笔≈账户总资产31%(等权3只)
      HTSC_ORDER_BUDGET: "${HTSC_ORDER_BUDGET:-0}"   # 或固定金额(元);0=不用
      # 信号引擎:momentum_v1(比赛冻结版,7/20后退役)|alloc_p1(走查冠军:股债金月度
      # 再平衡,AI审偏离;建议配 FULL_AUTH=0)|trend(旧)
      SIGNAL_ENGINE: "${SIGNAL_ENGINE:-momentum_v1}"
      ALLOC_WEIGHTS: "${ALLOC_WEIGHTS:-510300.SH:0.40,511260.SH:0.40,518880.SH:0.20}"
      PAPER_TOTAL: "${PAPER_TOTAL:-1000000}"         # alloc_p1 纸面模式的名义总资产(元)
      SIGNAL_EXCLUDE: "${SIGNAL_EXCLUDE:-511990.SH}" # 信号池排除(货币ETF只当停泊)
      WATCHLIST_FILE: "${WATCHLIST_FILE:-/data/watchlist.txt}"  # 参赛用 /data/watchlist-etf.txt
      # 资金流/新闻走东财新浪、决策走 deepseek,全直连(防宿主代理注入)。
      # 华泰在 ai.zhangle.com,也需直连,放行(不走代理)。
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "*"
    volumes:
      - "./watchlist.txt:/data/watchlist.txt:ro"
      - "./watchlist-etf.txt:/data/watchlist-etf.txt:ro"
      - "./watchlist-etf-broad.txt:/data/watchlist-etf-broad.txt:ro"
      - "./watchlist-kechuang-semi.txt:/data/watchlist-kechuang-semi.txt:ro"
      - "./watchlist-smartbeta.txt:/data/watchlist-smartbeta.txt:ro"
      - "./reports:/reports"

volumes:
  mongo_data:
